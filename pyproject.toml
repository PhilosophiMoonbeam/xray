[project]
name = "xray"
version = "0.8.0"
description = "XRAY: Agent-centric code intelligence CLI with MCP compatibility - Map, Find, Interface, Impact"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Srijan Shukla", email = "srijanshukla18@gmail.com" }
]
keywords = ["cli", "agents", "mcp", "code-intelligence", "ai-assistant", "code-analysis", "ast-grep", "structural-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=3.4.2,<4",
    "ast-grep-cli>=0.39.0",
    "thefuzz>=0.20.0",
    "pydantic>=2.0,<3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
    "vulture>=2.14",
]

[project.urls]
Homepage = "https://github.com/srijanshukla18/xray"
Repository = "https://github.com/srijanshukla18/xray"
Issues = "https://github.com/srijanshukla18/xray/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xray = ["skills/**/*"]

[project.scripts]
xray = "xray.cli:main"
xray-mcp = "xray.mcp_server:main"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["test_samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PL", "RUF"]
fixable = ["ALL"]
ignore = [
    "PLC0415", # Late imports
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "RUF012",  # Mutable class attributes
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR2004", "E501"]

[tool.vulture]
exclude = [
    ".venv",
    ".cache",
    "venv",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    "build",
    "dist",
    "tests",
    "test_samples",
]
ignore_decorators = [
    "@*.tool",
    "@*.resource",
    "@*.prompt",
    "@pytest.fixture",
    "@pytest.mark.*",
    "@contextmanager",
]
ignore_names = [
    "visit_*",
    "do_*",
    "test_*",
    "mock_*",
    "main",
]
paths = ["src", "mcp-config-generator.py"]
min_confidence = 80

[tool.pyright]
include = [
    "src",
    "mcp-config-generator.py",
    "tests",
]
exclude = [
    "**/__pycache__",
    ".venv",
    ".cache",
    ".ruff_cache",
    ".pytest_cache",
    ".reference_projects",
    "test_samples",
]
# Strategy: keep standard mode globally while public contracts and test helpers
# become typed. Strict mode was evaluated for source modules on 2026-06-28; the
# current low-risk step is broader checked coverage, then targeted strict files.
typeCheckingMode = "standard"
strict = ["src/xray/models.py", "src/xray/core/ast_grep.py", "mcp-config-generator.py"]
pythonVersion = "3.10"
reportMissingTypeStubs = false
