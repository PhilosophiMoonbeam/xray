model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
sandbox_mode = "danger-full-access"
approval_policy = "never"
web_search = "disabled"

[features]
multi_agent = true
multi_agent_v2 = true
hooks = true

[agents]
max_concurrent_threads_per_session = 3
interrupt_message = true

[agents.sol_design]
description = "Proposes one actionable material architecture decision for root."
config_file = "agents/sol_design.toml"

[agents.sol_write]
description = "Implements one semantic-quality-sensitive scoped assignment."
config_file = "agents/sol_write.toml"

[agents.breakthrough_read]
description = "Diagnoses one materially stuck failure with new evidence."
config_file = "agents/breakthrough_read.toml"

[agents.luna_read]
description = "Answers one bounded repository question with cited evidence."
config_file = "agents/luna_read.toml"

[agents.luna_write]
description = "Implements one conventional scoped assignment."
config_file = "agents/luna_write.toml"

[agents.terra_verify]
description = "Reviews one scoped change for concrete counterexamples when risk requires it."
config_file = "agents/terra_verify.toml"
